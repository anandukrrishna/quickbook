<!DOCTYPE html>
<html>

<head>

    <title>Edit Event - QuickBook</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-7">


                <div class="card shadow-sm">

                    <div class="card-body p-4">


                        <h2 class="mb-4">
                            Edit Event
                        </h2>


                        <!-- Error Message -->

                        {% if error %}

                            <div class="alert alert-danger">

                                {{ error }}

                            </div>

                        {% endif %}


                        <form method="POST">

                            {% csrf_token %}


                            <!-- Vendor -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Vendor

                                </label>


                                <select
                                    name="vendor"
                                    class="form-select"
                                    required
                                >

                                    {% for vendor in vendors %}

                                        <option
                                            value="{{ vendor.id }}"

                                            {% if vendor.id == event.vendor.id %}
                                                selected
                                            {% endif %}
                                        >

                                            {{ vendor.username }}

                                        </option>

                                    {% endfor %}

                                </select>

                            </div>


                            <!-- Title -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Title

                                </label>


                                <input
                                    type="text"
                                    name="title"
                                    value="{{ event.title }}"
                                    class="form-control"
                                    required
                                >

                            </div>


                            <!-- Description -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Description

                                </label>


                                <textarea
                                    name="description"
                                    class="form-control"
                                    rows="4"
                                    required
                                >{{ event.description }}</textarea>

                            </div>


                            <!-- Venue -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Venue

                                </label>


                                <input
                                    type="text"
                                    name="venue"
                                    value="{{ event.venue }}"
                                    class="form-control"
                                    required
                                >

                            </div>


                            <!-- Date -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Date

                                </label>


                                <input
                                    type="datetime-local"
                                    name="date"
                                    value="{{ event.date|date:'Y-m-d\TH:i' }}"
                                    class="form-control"
                                    required
                                >

                            </div>


                            <!-- Total Seats -->

                            <div class="mb-4">

                                <label class="form-label">

                                    Total Seats

                                </label>


                                <input
                                    type="number"
                                    name="total_seats"
                                    value="{{ event.total_seats }}"
                                    min="1"
                                    class="form-control"
                                    required
                                >

                            </div>


                            <!-- Buttons -->

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >

                                Update Event

                            </button>


                            <a
                                href="{% url 'event_list' %}"
                                class="btn btn-secondary"
                            >

                                Cancel

                            </a>


                        </form>


                    </div>

                </div>


            </div>

        </div>

    </div>


</body>

</html>
