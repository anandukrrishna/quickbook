<!DOCTYPE html>
<html>

<head>
    <title>Edit Vendor - QuickBook</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-6">

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h2 class="mb-4">
                            Edit Vendor
                        </h2>


                        <form method="POST">

                            {% csrf_token %}


                            <div class="mb-3">

                                <label class="form-label">
                                    Username
                                </label>

                                <input type="text" name="username" value="{{ vendor.username }}" class="form-control"
                                    required>

                            </div>


                            <div class="mb-4">

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email" name="email" value="{{ vendor.email }}" class="form-control"
                                    required>

                            </div>


                            <button type="submit" class="btn btn-primary">
                                Update Vendor
                            </button>


                            <a href="{% url 'vendor_list' %}" class="btn btn-secondary">
                                Cancel
                            </a>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
