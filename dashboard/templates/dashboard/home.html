<!DOCTYPE html>
<html>

<head>
    <title>QuickBook Staff Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <!-- Header -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h1>QuickBook Staff Dashboard</h1>

                <p class="text-muted mb-0">
                    Welcome, {{ request.user.username }}
                </p>
            </div>

            <a href="{% url 'web_logout' %}" class="btn btn-danger">
                Logout
            </a>

        </div>


        <hr class="mb-4">


        <!-- Statistics -->

        <h3 class="mb-3">
            Dashboard Statistics
        </h3>


        <div class="row g-3">

            <div class="col-md-3">

                <div class="card shadow-sm h-100">

                    <div class="card-body text-center">

                        <h6 class="text-muted">
                            Total Customers
                        </h6>

                        <h2>
                            {{ total_customers }}
                        </h2>

                    </div>

                </div>

            </div>


            <div class="col-md-3">

                <div class="card shadow-sm h-100">

                    <div class="card-body text-center">

                        <h6 class="text-muted">
                            Total Vendors
                        </h6>

                        <h2>
                            {{ total_vendors }}
                        </h2>

                    </div>

                </div>

            </div>


            <div class="col-md-3">

                <div class="card shadow-sm h-100">

                    <div class="card-body text-center">

                        <h6 class="text-muted">
                            Total Events
                        </h6>

                        <h2>
                            {{ total_events }}
                        </h2>

                    </div>

                </div>

            </div>


            <div class="col-md-3">

                <div class="card shadow-sm h-100">

                    <div class="card-body text-center">

                        <h6 class="text-muted">
                            Total Bookings
                        </h6>

                        <h2>
                            {{ total_bookings }}
                        </h2>

                    </div>

                </div>

            </div>

        </div>


        <!-- Management -->

        <h3 class="mt-5 mb-3">
            Management
        </h3>


        <div class="d-flex gap-2 flex-wrap">

            <a href="{% url 'user_list' %}" class="btn btn-primary">
                Manage Users
            </a>


            <a href="{% url 'vendor_list' %}" class="btn btn-success">
                Manage Vendors
            </a>


            <a href="{% url 'event_list' %}" class="btn btn-secondary">
                Manage Events
            </a>

        </div>

    </div>

</body>

</html>
