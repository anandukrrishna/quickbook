<li>
    {% if node.user.referral_position %}
        <strong>{{ node.user.referral_position }}:</strong>
    {% endif %}

    {{ node.user.username }}

    {% if node.children %}
        <ul>
            {% for child in node.children %}
                {% include "dashboard/referral_tree.html" with node=child %}
            {% endfor %}
        </ul>
    {% endif %}
</li>
