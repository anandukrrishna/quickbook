<li class="mb-2">

    {% if node.user.referral_position %}

    <span class="badge text-bg-primary">
        {{ node.user.referral_position }}
    </span>

    {% endif %}


    <strong>
        {{ node.user.username }}
    </strong>


    {% if node.children %}

    <ul class="mt-2">

        {% for child in node.children %}

        {% include "dashboard/referral_tree.html" with node=child %}

        {% endfor %}

    </ul>

    {% endif %}

</li>
