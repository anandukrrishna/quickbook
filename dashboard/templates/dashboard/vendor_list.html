<!DOCTYPE html>
<html>

<head>
    <title>Vendors - QuickBook</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <!-- Header -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h1 class="mb-0">
                Vendor Management
            </h1>

            <a href="{% url 'add_vendor' %}" class="btn btn-primary">
                Add Vendor
            </a>

        </div>


        <!-- Vendor List -->

        <div class="card shadow-sm">

            <div class="card-body">

                <h4 class="mb-3">
                    All Vendors
                </h4>


                {% if vendors %}

                <div class="table-responsive">

                    <table class="table table-bordered table-hover">

                        <thead class="table-light">

                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Action</th>
                            </tr>

                        </thead>


                        <tbody>

                            {% for vendor in vendors %}

                            <tr>

                                <td>
                                    {{ vendor.id }}
                                </td>

                                <td>
                                    {{ vendor.username }}
                                </td>

                                <td>
                                    {{ vendor.email }}
                                </td>

                                <td>

                                    <a href="{% url 'edit_vendor' vendor.id %}" class="btn btn-sm btn-warning">
                                        Edit
                                    </a>


                                    <a href="{% url 'delete_vendor' vendor.id %}" class="btn btn-sm btn-danger">
                                        Delete
                                    </a>

                                </td>

                            </tr>

                            {% endfor %}

                        </tbody>

                    </table>

                </div>


                {% else %}

                <div class="alert alert-info mb-0">
                    No vendors found.
                </div>

                {% endif %}

            </div>

        </div>


        <!-- Back Button -->

        <div class="mt-3">

            <a href="{% url 'dashboard_home' %}" class="btn btn-secondary">
                Back to Dashboard
            </a>

        </div>

    </div>

</body>

</html>
